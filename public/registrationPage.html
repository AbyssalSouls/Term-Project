<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="styles/registrationPage.css" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="logo">Logo!</div>
    </header>

    <main class="register-container">
        <h1>Create Account</h1>
        <form class="register-form" action="#" method="post">
            <div class="input-group">
                <input type="text" id="full-name" name="full-name" placeholder="First and Last Name" required>
            </div>

            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <input type="tel" id="phone" name="phone" placeholder="Mobile Phone Number" required>
            </div>

            <div class="input-group password-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="terms" required>
                    <span>I have read and consent to the <a href="#">Terms of Service</a></span>
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" name="conduct" required>
                    <span>I have read and consent to the <a href="#">User Code of Conduct</a></span>
                </label>
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>

        <p class="login-prompt">
            Have an account? <a href="loginPage.html">Sign In</a>
        </p>
    </main>

    <footer class="site-footer">
        <p class="footer-links">
            <a href="#">Terms & Conditions</a>
            <span class="divider">|</span>
            <a href="#">Contact Us</a>
        </p>
        <p class="copyright">© 2026 PCPartsHub. All rights reserved.</p>
    </footer>

</body>

</html>
