<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="styles/loginPage.css" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <div class="logo">Logo!</div>
    </header>

    <main class="login-container">
        <h1>Sign In</h1>
        <form class="login-form" action="#" method="post">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>
        <p class="register-prompt">
            Don't have an account? <a href="registrationPage.html">Register here</a>
        </p>
    </main>

    <footer class="site-footer">
        <p class="footer-links">
            <a href="#">Terms & Conditions</a>
            <span class="divider">|</span>
            <a href="#">Contact Us</a>
        </p>
        <p class="copyright">© 2026 PCPartsHub. All rights reserved.</p>
    </footer>

</body>

</html>
